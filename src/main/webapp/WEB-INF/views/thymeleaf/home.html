<!DOCTYPE HTML>
<html lang="en" xmlns:th="http://www.thymeleaf.org">

<head th:replace="~{fragments :: head(null)}"></head>

<body class="bg-gray-100 min-h-screen flex flex-col">

  <nav th:replace="~{fragments :: navbar}"></nav>

  <main role="main" class="flex-1 flex flex-col items-center justify-center gap-4 p-4">
    <h1 class="text-3xl font-semibold text-gray-900">Welcome to Taller Web 1</h1>

    <p class="text-gray-600">
      You are signed in as <span class="font-medium text-gray-900" th:text="${user.email}">email</span>
      <span th:if="${user.role != null}"
        class="ml-2 rounded-full bg-gray-200 px-3 py-1 text-xs font-medium text-gray-700"
        th:text="${user.role}">ROLE</span>
    </p>

    <a th:href="@{/home}" class="text-blue-600 hover:underline">Reload</a>
  </main>
  <!-- /.container -->

</body>

</html>
