<!DOCTYPE HTML>
<html lang="es" xmlns:th="http://www.thymeleaf.org">

<head th:fragment="head(pageTitle)">
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, shrink-to-fit=no">

  <title th:text="${pageTitle != null} ? ${pageTitle} : 'Taller Web I'">Taller Web I</title>

  <!-- Hoja de estilos generada por Vite + Tailwind (build-time) -->
  <link rel="stylesheet" th:href="@{/dist/main.css}" />
</head>

<body class="bg-gray-100 min-h-screen flex flex-col">

  <nav th:fragment="navbar" class="bg-gray-900 text-white shadow">
    <a class="navbar-brand inline-block text-lg px-4 py-3 font-semibold hover:text-gray-300" href="#">UNLAM</a>
  </nav>

  <p th:fragment="errorAlert(errorMessage)" th:if="${errorMessage != null}"
    class="alert alert-danger my-4 rounded-md bg-red-100 px-4 py-3 text-sm text-red-700"
    th:text="'Error ' + ${errorMessage}"></p>

</body>

</html>
