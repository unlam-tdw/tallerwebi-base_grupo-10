<!DOCTYPE HTML>
<html lang="en" xmlns:th="http://www.thymeleaf.org">

<head th:fragment="head(pageTitle)">
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, shrink-to-fit=no">

  <title th:text="${pageTitle != null} ? ${pageTitle} : 'Taller Web I'">Taller Web I</title>

  <!-- Stylesheet generated by Vite + Tailwind (build-time) -->
  <link rel="stylesheet" th:href="@{/dist/main.css}" />
</head>

<body class="bg-gray-100 min-h-screen flex flex-col">

  <nav th:fragment="navbar" class="flex items-center justify-between bg-gray-900 px-4 text-white shadow">
    <a class="navbar-brand inline-block py-3 text-lg font-semibold hover:text-gray-300" href="#">UNLAM</a>
    <div th:if="${user != null}" class="flex items-center gap-4 text-sm">
      <span class="text-gray-300">Signed in as
        <span class="font-medium text-white" th:text="${user.email}">email</span>
      </span>
      <form th:action="@{/logout}" method="POST">
        <button type="submit" class="rounded-md bg-gray-700 px-3 py-2 hover:bg-gray-600">Logout</button>
      </form>
    </div>
  </nav>

  <p th:fragment="errorAlert(errorMessage)" th:if="${errorMessage != null}"
    class="alert alert-danger my-4 rounded-md bg-red-100 px-4 py-3 text-sm text-red-700"
    th:text="${errorMessage}"></p>

</body>

</html>
