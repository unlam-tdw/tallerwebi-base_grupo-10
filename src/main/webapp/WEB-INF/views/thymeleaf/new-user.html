<!DOCTYPE HTML>
<html lang="en" xmlns:th="http://www.thymeleaf.org">

<head th:replace="~{fragments :: head(null)}"></head>

<body class="bg-gray-100 min-h-screen flex flex-col">

  <nav th:replace="~{fragments :: navbar}"></nav>

  <main role="main" class="flex-1 flex items-center justify-center p-4">

    <div id="loginbox" class="w-full max-w-md rounded-lg bg-white p-8 shadow-md">
      <form action="#" th:action="@{/register}" method="POST" th:object="${newUserData}">
        <h3 class="mb-2 text-2xl font-semibold text-gray-900">New User</h3>
        <hr class="mb-6 border-gray-200">
        <div>
          <label for="email" class="mb-1 block text-sm font-medium text-gray-700">Email</label>
          <input th:field="*{email}" id="email" name="email" type="email"
            class="mb-1 w-full rounded-md border border-gray-300 px-3 py-2 focus:border-blue-500 focus:outline-none" />
          <p th:if="${#fields.hasErrors('email')}" th:errors="*{email}"
            class="alert alert-danger mb-2 text-sm text-red-600"></p>
        </div>
        <div class="mt-4">
          <label for="password" class="mb-1 block text-sm font-medium text-gray-700">Password</label>
          <input th:field="*{password}" type="password" id="password" name="password"
            class="mb-1 w-full rounded-md border border-gray-300 px-3 py-2 focus:border-blue-500 focus:outline-none" />
          <p th:if="${#fields.hasErrors('password')}" th:errors="*{password}"
            class="alert alert-danger mb-2 text-sm text-red-600"></p>
        </div>

        <button id="btn-register" type="submit"
          class="mt-6 w-full rounded-md bg-blue-600 py-2 font-medium text-white transition hover:bg-blue-700">Register</button>

        <p th:replace="~{fragments :: errorAlert(${error})}"></p>
      </form>
    </div>

  </main>
  <!-- /.container -->

</body>

</html>
