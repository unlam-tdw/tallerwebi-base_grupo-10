<!DOCTYPE HTML>
<html lang="en" xmlns:th="http://www.thymeleaf.org">

<head th:replace="~{layouts/base :: head(null)}"></head>

<body th:replace="~{layouts/base :: layout(~{::main})}">

  <main id="loginbox" class="flex-1 flex items-center justify-center p-4">

    <div class="w-full max-w-md rounded-lg bg-white p-8 shadow-md">
      <form action="#" th:action="@{/validate-login}" method="POST" th:object="${loginData}">
        <h3 class="mb-2 text-2xl font-semibold text-gray-900">Taller Web I</h3>
        <hr class="mb-6 border-gray-200">
        <div>
          <label for="email" class="mb-1 block text-sm font-medium text-gray-700">Email</label>
          <input th:field="*{email}" id="email" name="email" type="email"
            class="mb-1 w-full rounded-md border border-gray-300 px-3 py-2 focus:border-blue-500 focus:outline-none" />
          <p th:if="${#fields.hasErrors('email')}" th:errors="*{email}"
            class="alert alert-danger mb-2 text-sm text-red-600"></p>
        </div>
        <div class="mt-4">
          <label for="password" class="mb-1 block text-sm font-medium text-gray-700">Password</label>
          <input th:field="*{password}" type="password" id="password" name="password"
            class="mb-1 w-full rounded-md border border-gray-300 px-3 py-2 focus:border-blue-500 focus:outline-none" />
          <p th:if="${#fields.hasErrors('password')}" th:errors="*{password}"
            class="alert alert-danger mb-2 text-sm text-red-600"></p>
        </div>

        <button id="btn-login" type="submit"
          class="mt-6 w-full rounded-md bg-blue-600 py-2 font-medium text-white transition hover:bg-blue-700 disabled:cursor-not-allowed disabled:opacity-50">Sign in</button>

        <p th:replace="~{components/alerts/error-alert :: errorAlert(${error})}"></p>
      </form>
      <div class="mt-4 text-center text-sm">
        <a id="btn-register" href="new-user" class="text-blue-600 hover:underline">Register</a>
      </div>
    </div>
  </main>
  <!-- /.container -->

</body>

</html>
