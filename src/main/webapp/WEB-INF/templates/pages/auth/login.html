<!DOCTYPE HTML>
<html lang="en" xmlns:th="http://www.thymeleaf.org">

<head th:replace="~{layouts/base :: head(null)}"></head>

<body th:replace="~{layouts/base :: layout(~{::main})}">

  <main id="loginbox" class="flex-1 flex items-center justify-center p-4">
    <div id="login-app" class="w-full max-w-md rounded-lg bg-white p-8 shadow-md">
      <form @submit.prevent="submit" action="#" th:action="@{/validate-login}" method="POST">
        <h3 class="mb-2 text-2xl font-semibold text-gray-900">Taller Web I</h3>
        <hr class="mb-6 border-gray-200">
        <div>
          <label for="email" class="mb-1 block text-sm font-medium text-gray-700">Email</label>
          <input v-model="email" id="email" name="email" type="email"
            class="mb-1 w-full rounded-md border border-gray-300 px-3 py-2 focus:border-blue-500 focus:outline-none" />
          <p v-if="errors.email" class="alert alert-danger mb-2 text-sm text-red-600">{{ errors.email }}</p>
        </div>
        <div class="mt-4">
          <label for="password" class="mb-1 block text-sm font-medium text-gray-700">Password</label>
          <input v-model="password" type="password" id="password" name="password"
            class="mb-1 w-full rounded-md border border-gray-300 px-3 py-2 focus:border-blue-500 focus:outline-none" />
          <p v-if="errors.password" class="alert alert-danger mb-2 text-sm text-red-600">{{ errors.password }}</p>
        </div>
        <button id="btn-login" type="submit" :disabled="loading"
          class="mt-6 w-full rounded-md bg-blue-600 py-2 font-medium text-white transition hover:bg-blue-700 disabled:cursor-not-allowed disabled:opacity-50">
          <span v-if="loading">Signing in...</span>
          <span v-else>Sign in</span>
        </button>
        <p v-if="error" class="alert alert-danger my-4 rounded-md bg-red-100 px-4 py-3 text-sm text-red-700">{{ error }}</p>
      </form>
      <div class="mt-4 text-center text-sm">
        <a id="btn-register" href="new-user" class="text-blue-600 hover:underline">Register</a>
      </div>
    </div>
  </main>

  <script th:inline="javascript">
    const app = Vue.createApp({
      data() {
        return {
          email: '',
          password: '',
          error: '',
          errors: {},
          loading: false
        }
      },
      methods: {
        async submit() {
          this.loading = true;
          this.error = '';
          this.errors = {};
          const form = this.$el.querySelector('form');
          const res = await fetch(form.action, { method: 'POST', body: new FormData(form) });
          if (res.redirected) {
            window.location.href = res.url;
          } else {
            const html = await res.text();
            const doc = new DOMParser().parseFromString(html, 'text/html');
            const errorEl = doc.querySelector('.alert-danger');
            const fieldErrors = doc.querySelectorAll('.alert-danger');
            if (errorEl && !fieldErrors[0].id) {
              this.error = errorEl.textContent.trim();
            }
            fieldErrors.forEach(el => {
              if (el.previousElementSibling && el.previousElementSibling.name) {
                this.errors[el.previousElementSibling.name] = el.textContent.trim();
              }
            });
          }
          this.loading = false;
        }
      }
    });
    app.mount('#login-app');
  </script>

</body>

</html>
