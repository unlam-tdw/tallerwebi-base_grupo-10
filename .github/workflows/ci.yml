name: continuous_integration
run-name: ${{ github.actor }} is testing out GitHub Actions 🚀
on:
  pull_request:
    branches: ["main"]
  push:
    branches: ["main"]
jobs:
  Explore-GitHub-Actions:
    runs-on: ubuntu-latest
    steps:
      - run: echo "🎉 This job was triggered automatically by the ${{ github.event_name }} event"
      - run: echo "🐧 This job is running on a ${{ runner.os }} server by GitHub!"
      - run: echo "🔎 The branch name is ${{ github.ref }} and your repository is ${{ github.repository }}."
      - name: Downloading the code
        uses: actions/checkout@v4
      - name: Configure JDK 25
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '25'
          cache: 'maven'
      - run: echo "💡 The repository ${{ github.repository }} has been cloned."
      - run: echo "🖥️ The workflow is ready to test the code"
      - name: Running the tests
        run: |
          mvn clean verify --fail-at-end
      - run: echo "🍏 The job status is ${{ job.status }}."
      - name: Install node packages
        run: |
          cd src/main/frontend
          npm ci
      - name: Compile the frontend styles (Vite + Tailwind, CSS only)
        run: |
          cd src/main/frontend
          npm run build